[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uav-sway"
version = "0.1.0"
description = "Passive six-DoF UAV planar rigid-link model"
requires-python = ">=3.11,<3.12"
dependencies = ["numpy", "mujoco>=3.0", "pyyaml", "matplotlib", "imageio"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
